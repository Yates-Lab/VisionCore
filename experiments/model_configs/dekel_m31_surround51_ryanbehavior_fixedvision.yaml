# Wider-aperture continuation of M26.  The behavior and output-residual paths
# retain Ryan's 120-Hz preprocessing contract; visual kernels remain fixed and
# the Gaussian readouts adapt to the 13x13 scaffold.
model_type: v1multi
sampling_rate: 240
initial_input_channels: 1

adapter: {type: none, params: {}}
frontend: {type: none, params: {}}

convnet:
  type: dekel
  params:
    temporal_support: 60
    temporal_channels: 14
    spatial_channels: [84, 84, 84]
    spatial_kernels: [15, 11, 9]
    norm_groups: [14, 28, 21, 14]
    input_size: [51, 51]
    scaffold_size: 13
    scaffold_mode: nearest
    pool_norm: 5
    strict_input_size: true
    frequency_mask:
      temporal: true
      stem_spatial: true
      hidden_spatial: false
      window: hann
      fft_pad: 2

modulator:
  type: mlp_behavior
  params:
    behavior_dim: 42
    hidden_dims: [128]
    additive_dim: 64
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_film: true
    film_max_gain: 0.5

recurrent: {type: none, params: {}}

readout:
  type: gaussian
  params:
    n_units: 8
    bias: true
    initial_std: 0.5
    initial_mean_scale: 0.1

output_modulator:
  type: mlp_behavior_residual
  params:
    behavior_dim: 42
    hidden_dims: [64]
    bottleneck_dim: 32
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_gain: true
    max_gain: 0.5

output_activation: softplus

regularization:
  - name: gaussian_width
    type: l2
    lambda: 1.0e-5
    apply_to: ["readouts/std"]
    schedule: {kind: constant}
  - name: gaussian_width_floor
    type: proximal_clamp_min
    lambda: 0.5
    apply_to: ["readouts/std"]
    schedule: {kind: constant}
  - name: behavior_mlp_weight
    type: l2
    lambda: 1.0e-5
    apply_to: ["^modulator"]
    schedule: {kind: constant}
  - name: output_behavior_projection_weight
    type: l2
    lambda: 1.0e-5
    apply_to:
      - "output_modulator/offset_layers/weight"
      - "output_modulator/gain_layers/weight"
    schedule: {kind: constant}
  - name: exclude_readout_means_from_wd
    type: l2
    lambda: 0.0
    apply_to: ["readouts/mean"]
    schedule: {kind: constant}
