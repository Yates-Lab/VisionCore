# Native-240 M77 follow-up with the ordinary eight-filter spatiotemporal stem
# and a continuous-SO(2) equivariant spatial suffix.  Time still disappears in
# the 60 x 7 x 7 Conv3d.  The subsequent 15/11/9 spatial stages each contain
# eight steerable Fourier fields band-limited through angular frequency m=3.
model_type: v1multi
sampling_rate: 240
initial_input_channels: 1

adapter: {type: none, params: {}}
frontend: {type: none, params: {}}

convnet:
  type: dekel_so2
  params:
    temporal_support: 60
    temporal_channels: 8
    spatial_fields: [8, 8, 8]
    spatial_kernels: [15, 11, 9]
    maximum_frequency: 3
    orientation_samples: 16
    norm_groups: [8, 4, 4, 4]
    normalization:
      type: groupnorm_lrn_presplit
      lrn_size: 5
      lrn_alpha: 0.1
      lrn_beta: 0.75
      lrn_k: 1.0
    input_size: [35, 35]
    scaffold_size: 9
    scaffold_mode: nearest
    pool_sigma: 0.6
    strict_input_size: true
    frequency_mask:
      temporal: true
      stem_spatial: true
      hidden_spatial: false
      window: hann
      fft_pad: 2

modulator:
  type: mlp_behavior
  params:
    behavior_dim: 42
    hidden_dims: [128]
    additive_dim: 64
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_film: true
    film_max_gain: 0.5

recurrent: {type: none, params: {}}

readout:
  type: gaussian
  params:
    n_units: 8
    bias: true
    initial_std: 0.5
    initial_mean_scale: 0.1

output_activation: softplus

regularization:
  # Half the spatial Laplacian strength used by the lower-regularization
  # four-filter control.  The frequency cap remains enforced in the forward
  # pass, while the SO(2) kernel basis regularizes the spatial suffix.
  - name: first_layer_spatial_smoothness
    type: laplacian
    lambda: 2.5e-4
    apply_to: ["convnet/temporal_conv/conv/weight"]
    dims: [-2, -1]
    padding_mode: constant
    reduction: dekel
    schedule: {kind: ramp_then_constant, start_epoch: 4, end_epoch: 20}
  - name: gaussian_width
    type: l2
    lambda: 1.0e-5
    apply_to: ["readouts/std"]
    schedule: {kind: constant}
  - name: gaussian_width_floor
    type: proximal_clamp_min
    lambda: 0.5
    apply_to: ["readouts/std"]
    schedule: {kind: constant}
  - name: behavior_mlp_weight
    type: l2
    lambda: 1.0e-5
    apply_to: ["modulator/weight"]
    schedule: {kind: constant}
  - name: exclude_readout_means_from_wd
    type: l2
    lambda: 0.0
    apply_to: ["readouts/mean"]
    schedule: {kind: constant}
