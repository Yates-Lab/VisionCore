# Additive-only control matched to dekel_m16_output_behavior_gain_additive.yaml.
# It separates the value of behavior-dependent response gain from a conventional
# neuron-specific additive behavioral drive.
model_type: v1multi
sampling_rate: 240
initial_input_channels: 1

adapter: {type: none, params: {}}
frontend: {type: none, params: {}}

convnet:
  type: dekel
  params:
    temporal_support: 60
    temporal_channels: 14
    spatial_channels: [84, 84, 84]
    spatial_kernels: [15, 11, 9]
    norm_groups: [14, 28, 21, 14]
    input_size: [35, 35]
    scaffold_size: 9
    scaffold_mode: nearest
    pool_norm: 5
    strict_input_size: true
    frequency_mask:
      temporal: true
      stem_spatial: true
      hidden_spatial: false
      window: hann
      fft_pad: 2

modulator:
  type: mlp_behavior
  params:
    behavior_dim: 42
    hidden_dims: [128]
    additive_dim: 64
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_film: true
    film_max_gain: 0.5

recurrent: {type: none, params: {}}

readout:
  type: gaussian
  params:
    n_units: 8
    bias: true
    initial_std: 0.5
    initial_mean_scale: 0.1

output_modulator:
  type: mlp_behavior_residual
  params:
    behavior_dim: 42
    hidden_dims: [64]
    bottleneck_dim: 32
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_gain: false
    max_gain: 0.5

output_activation: softplus
regularization: []
