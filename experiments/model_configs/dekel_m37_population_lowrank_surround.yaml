# M37: preserve M26 and add a compact second Gaussian whose feature tuning is
# a rank-4 mixture of the mature feature projections already learned by the
# neurons in each session.  This expands beyond a strictly matched surround
# while remaining far smaller and smoother than an independent dense readout.
model_type: v1multi
sampling_rate: 240
initial_input_channels: 1

adapter: {type: none, params: {}}
frontend: {type: none, params: {}}

convnet:
  type: dekel
  params:
    temporal_support: 60
    temporal_channels: 14
    spatial_channels: [84, 84, 84]
    spatial_kernels: [15, 11, 9]
    norm_groups: [14, 28, 21, 14]
    input_size: [35, 35]
    scaffold_size: 9
    scaffold_mode: nearest
    pool_norm: 5
    strict_input_size: true
    frequency_mask:
      temporal: true
      stem_spatial: true
      hidden_spatial: false
      window: hann
      fft_pad: 2

modulator:
  type: mlp_behavior
  params:
    behavior_dim: 42
    hidden_dims: [128]
    additive_dim: 64
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_film: true
    film_max_gain: 0.5

recurrent: {type: none, params: {}}

readout:
  type: gaussian
  params:
    n_units: 8
    bias: true
    initial_std: 0.5
    initial_mean_scale: 0.1

residual_readout:
  type: residual_gaussian
  params:
    input_scope: visual
    feature_mode: base_population_lowrank
    population_rank: 4
    max_population_mix: 0.5
    max_mean_delta: 4.0
    initial_std_scale: 2.0
    min_std_scale: 0.75
    max_std_scale: 4.0

output_modulator:
  type: mlp_behavior_residual
  params:
    behavior_dim: 42
    hidden_dims: [64]
    bottleneck_dim: 32
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_gain: true
    max_gain: 0.5

output_activation: softplus

regularization:
  - name: residual_population_factors
    type: l2
    lambda: 1.0e-4
    apply_to:
      - "residual_readouts/population_left"
      - "residual_readouts/population_right"
    schedule: {kind: constant}
  - name: residual_readout_center_delta
    type: l2
    lambda: 1.0e-4
    apply_to: ["residual_readouts/mean_delta"]
    schedule: {kind: constant}
  - name: residual_readout_orientation_delta
    type: l2
    lambda: 1.0e-5
    apply_to: ["residual_readouts/theta_delta"]
    schedule: {kind: constant}
