# Capacity-matched control with no structural kernel penalties.  The Dekel
# Hamming parameterization is retained, but Laplacian and competitive
# regularizers are absent.  This isolates whether the early performance gap
# is caused by explicit structural regularization or by the feed-forward core.
model_type: v1multi
sampling_rate: 240
initial_input_channels: 1

adapter: {type: none, params: {}}
frontend: {type: none, params: {}}

convnet:
  type: dekel
  params:
    temporal_support: 60
    temporal_channels: 14
    spatial_channels: [84, 84, 84]
    spatial_kernels: [15, 11, 9]
    norm_groups: [14, 28, 21, 14]
    input_size: [35, 35]
    scaffold_size: 9
    scaffold_mode: nearest
    pool_norm: 5
    strict_input_size: true

modulator:
  type: mlp_behavior
  params:
    behavior_dim: 42
    hidden_dims: [128]
    additive_dim: 64
    activation: gelu
    dropout: 0.0
    input_norm: false
    use_film: true
    film_max_gain: 0.5

recurrent: {type: none, params: {}}

readout:
  type: gaussian
  params:
    n_units: 8
    bias: true
    initial_std: 0.5
    initial_mean_scale: 0.1

output_activation: softplus

regularization:
  - name: gaussian_width
    type: l2
    lambda: 1.0e-5
    apply_to: ["readouts/std"]
    schedule: {kind: constant}
  - name: gaussian_width_floor
    type: proximal_clamp_min
    lambda: 1.0e-3
    apply_to: ["readouts/std"]
    schedule: {kind: constant}
  - name: behavior_mlp_weight
    type: l2
    lambda: 1.0e-5
    apply_to: ["modulator/weight"]
    schedule: {kind: constant}
  - name: exclude_readout_means_from_wd
    type: l2
    lambda: 0.0
    apply_to: ["readouts/mean"]
    schedule: {kind: constant}
