name: native240_sparse_phase_v1
description: >-
  Scratch Poisson core fit, frozen sparse phase-readout refinement, and
  low-core-learning-rate end-to-end fine-tuning at native 240 Hz.
checkpoint_root: /mnt/ssd/YatesMarmoV1/conv_model_fits/experiments/production_curriculum
project_name: model_selection
trainer: training/train_multidataset.py
common:
  max_datasets: 30
  batch_size: 128
  weight_decay: 1.0e-5
  accumulate_grad_batches: 1
  steps_per_epoch: 512
  gradient_clip_val: 10.0
  precision: bf16-mixed
  dset_dtype: uint8
  num_workers: 16
  limit_val_batches: 0.1
  seed: 201
  homogeneous_batches: true
  early_stopping: false
stages:
  - key: core
    model_config: experiments/model_configs/dekel_native240_curriculum_stage1_core.yaml
    dataset_config: paper/model_selection/configs/multi_240_long_split3_dekel35.yaml
    initialization: scratch
    handoff: best_val_bps
    learning_rate: 5.0e-4
    core_lr_scale: 1.0
    lr_scheduler: cosine_warmup
    warmup_epochs: 2
    max_epochs: 488
    check_val_every_n_epoch: 4
  - key: sparse_readout
    model_config: experiments/model_configs/dekel_native240_curriculum_stage2_sparse_readout.yaml
    dataset_config: paper/model_selection/configs/multi_240_long_split3_dekel35_allgratings.yaml
    initialization: previous
    pretrained_load_heads: true
    handoff: last
    learning_rate: 1.0e-4
    core_lr_scale: 1.0
    lr_scheduler: cosine_warmup
    warmup_epochs: 2
    max_epochs: 24
    check_val_every_n_epoch: 8
  - key: finetune
    model_config: experiments/model_configs/dekel_native240_curriculum_stage3_finetune.yaml
    dataset_config: paper/model_selection/configs/multi_240_long_split3_dekel35_allgratings.yaml
    initialization: previous
    pretrained_load_heads: true
    handoff: best_val_bps
    learning_rate: 1.0e-4
    core_lr_scale: 0.05
    lr_scheduler: cosine_warmup
    warmup_epochs: 2
    max_epochs: 64
    check_val_every_n_epoch: 4
