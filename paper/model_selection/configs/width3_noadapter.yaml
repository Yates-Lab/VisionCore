# Capacity-ladder rung: width=3
# Generated by paper/model_selection/gen_configs.py
# Base: learned_resnet_concat_convgru_gaussian.yaml
# Adapter: none (identity)
model_type: v1multi
initial_input_channels: 1
adapter:
  type: none
  params: {}
frontend:
  type: learnable_temporal
  params:
    kernel_size: 16
    num_channels: 4
    init_type: gaussian_derivatives
    split_MP: false
    aa_signal: true
    aa_window: hann
    aa_window_kwargs:
      power: 0.25
    use_weight_norm: false
    keep_unit_norm: false
    causal: true
    bias: false
convnet:
  type: resnet
  params:
    channels:
    - 192
    - 384
    stem_config:
      out_channels: 24
      conv_params:
        type: standard
        kernel_size:
        - 1
        - 7
        - 7
        padding:
        - 0
        - 0
        - 0
        stride: 1
        dilation:
        - 1
        - 1
        - 1
        aa_signal: true
        weight_norm_dim: 0
        use_weight_norm: true
        keep_unit_norm: true
      norm_type: rms
      act_type: splitrelu
      pool_params: null
      dropout: 0.0
      order:
      - pad
      - conv
      - norm
      - act
    block_configs:
    - conv_params:
        type: standard
        kernel_size:
        - 3
        - 9
        - 9
        aa_signal: true
        aa_window: hann
        aa_window_kwargs:
          power: 1.0
        use_weight_norm: true
        keep_unit_norm: true
        padding:
        - 0
        - 0
        - 0
      norm_type: grn
      act_type: splitrelu
      dropout: 0.0
      pool_params:
        type: max
        kernel_size: 2
        stride: 2
    - conv_params:
        type: standard
        kernel_size:
        - 3
        - 5
        - 5
        use_weight_norm: true
        keep_unit_norm: true
        aa_signal: true
        padding:
        - 0
        - 0
        - 0
      norm_type: grn
      act_type: splitrelu
      dropout: 0.0
      pool_params: null
modulator:
  type: concat
  params:
    behavior_dim: 42
    feature_dim: 96
recurrent:
  type: convgru
  params:
    n_layers: 1
    hidden_dim: 384
    kernel_size: 3
readout:
  type: gaussian
  params:
    n_units: 8
    bias: true
    initial_std: 0.5
    initial_mean_scale: 0.1
output_activation: softplus
regularization:
- name: readout_sparsity
  type: l1
  lambda: 1.0e-07
  apply_to:
  - readouts/features
  schedule:
    kind: warmup
    start_epoch: 30
- name: decay_readout_std
  type: proximal_clamp_positive
  lambda: 1.5
  apply_to:
  - readouts/std
  schedule:
    kind: linear_decay
    start_epoch: 0
    end_epoch: 50
    start_lambda: 10.0
- name: exclude_means_from_wd
  type: l2
  lambda: 0.0
  apply_to:
  - readouts/mean
  schedule:
    kind: constant
